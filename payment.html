<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="payment-card">
    <h2>💳 Pembayaran</h2>

    <p class="order-id">
        Order ID: <b><span id="orderId"></span></b>
    </p>

    <label for="name">Nama</label>
    <input type="text" id="name" placeholder="Nama customer">

    <label for="amount">Nominal</label>
    <input type="number" id="amount" placeholder="50000">

    <button id="payBtn">Bayar Sekarang</button>

    <!-- QR GOBIZ -->
    <div id="qrisBox" style="display:none; text-align:center; margin-top:20px">
        <p>📱 Scan QR GoBiz</p>

        <img 
            src="/photos/assets/qris-gobiz-owner.png.jpeg" 
            width="260" 
            alt="QR GoBiz Owner"
        >

        <p style="margin-top:10px">
            Order ID:<br>
            <b id="showOrderId"></b>
        </p>

        <!-- BUTTON KONFIRMASI -->
        <button 
            id="confirmBtn" 
            style="margin-top:15px; background:#2ecc71; color:#fff; padding:10px 16px; border:none; border-radius:6px; cursor:pointer;"
        >
            ✅ Konfirmasi Pembayaran
        </button>
    </div>

    <div id="status" style="margin-top:15px"></div>
</div>

<script src="payment.js"></script>
</body>
</html>
